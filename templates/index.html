{% extends 'base.html' %}{% block content %}
<div class="layout"><aside class="panel sidebar"><h2>대화 기록</h2><button id="newChat">+ 새 대화</button><div id="history">{% for c in conversations %}<button class="history-item" data-id="{{ c.id }}">{{ c.title }}</button>{% endfor %}</div><hr><small>답변 모델: {{ chat_model }}<br>검색 모델: {{ embed_model }}</small></aside>
<section class="panel chat"><h1>사내 매뉴얼에 질문하세요</h1><p class="muted">예: 휴가 신청 절차는 어떻게 되나요?</p><div id="messages" aria-live="polite"><div class="bubble assistant">안녕하세요. 업로드된 사내 매뉴얼의 근거로 답변합니다.</div></div><form id="ask"><textarea id="question" rows="3" maxlength="2000" placeholder="업무 질문을 입력하세요" required></textarea><button id="send">질문하기</button></form><div id="status" role="status"></div></section></div>
<section class="panel pw"><details><summary>내 비밀번호 변경</summary><form method="post" action="/password"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="password" name="current" placeholder="현재 비밀번호" required><input type="password" name="new_password" minlength="10" placeholder="새 비밀번호 (10자 이상)" required><button>변경</button></form></details></section>
<script src="/static/app.js" defer></script>{% endblock %}
